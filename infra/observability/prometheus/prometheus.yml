global:
  scrape_interval: 15s

scrape_configs:
  - job_name: graphite-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
  - job_name: graphite-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4001"]
  - job_name: graphite-data
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:50052"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
