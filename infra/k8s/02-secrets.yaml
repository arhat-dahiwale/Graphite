# Replace with real secrets via your secret manager before any real deploy.
apiVersion: v1
kind: Secret
metadata:
  name: graphite-secrets
  namespace: graphite
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "replace-me-better-auth-secret-0123456789abcdef"
  INTERNAL_MCP_SECRET: "replace-me-internal-mcp-secret-0123456789abcdef"
