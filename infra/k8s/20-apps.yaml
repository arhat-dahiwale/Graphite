# Graphite API: Deployment + Service + HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: graphite
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: graphite-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 4000 }
          envFrom:
            - configMapRef: { name: graphite-config }
            - secretRef: { name: graphite-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: graphite
spec:
  selector: { app: api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: graphite
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# Graphite web (Next.js standalone).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: graphite
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: graphite-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3000 }
          env:
            - name: NODE_ENV
              value: production
            - name: API_URL
              value: http://api:4000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: graphite
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: graphite
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# Graphite data service (gRPC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
  namespace: graphite
spec:
  replicas: 2
  selector:
    matchLabels: { app: data }
  template:
    metadata:
      labels: { app: data }
    spec:
      containers:
        - name: data
          image: graphite-data:local
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 50051 }
            - { containerPort: 50052 }
          envFrom:
            - configMapRef: { name: graphite-config }
            - secretRef: { name: graphite-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 50052 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 50052 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: data
  namespace: graphite
spec:
  selector: { app: data }
  ports:
    - { name: grpc, port: 50051, targetPort: 50051 }
    - { name: health, port: 50052, targetPort: 50052 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data
  namespace: graphite
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: data }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
